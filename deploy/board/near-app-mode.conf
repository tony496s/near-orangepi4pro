# Drop-in for near-app.service, installed as /etc/systemd/system/near-app.service.d/mode.conf by install.sh.
# ~/near/mode.env (owned by orangepi) picks what near-app runs without sudo: near-demo writes it for the agent console
# demo (NEAR_BUNDLE, NEAR_MODE) and `near-demo --off` deletes it. Values there override the unit's Environment= lines.
# The leading "-" makes the file optional: without it near-app runs exactly as the unit says.
[Service]
EnvironmentFile=-/home/orangepi/near/mode.env
