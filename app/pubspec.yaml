name: near_app
description: "Near desk strip: ambient day strip, focus timers, quick notes and reminders for a 1480x320 bar display."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

# No third-party packages: the app must build for flutter-pi (no platform plugins) as well as macOS for development.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

  # Be Vietnam Pro, SIL OFL 1.1 (fonts/OFL.txt).
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: fonts/BeVietnamPro-ExtraLight.ttf
          weight: 200
        - asset: fonts/BeVietnamPro-Light.ttf
          weight: 300
        - asset: fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: fonts/BeVietnamPro-Bold.ttf
          weight: 700
